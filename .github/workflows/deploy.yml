name: Build and Deploy Azure Container Apps

# Para ejecutar la acción en cada push a la rama main => hacer git push origin main
# el flujo desde otra rama no se ejecutará, a menos que se haga un merge a main
# git checkout main
# git merge deploy --> aqui deplos es la rama que contiene los cambios que queremos desplegar
# git push origin main

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read # Permite descargar el código del repositorio y hacer checkout 
  id-token: write # Permite generar un token de identidad para autenticación con Azure (OIDC)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Staging # Usa las variables de entorno definidas en la sección "Environments" de GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 # Configura Docker Buildx, which permite construir imágenes de contenedor multiplataforma y aprovechar características avanzadas de construcción.

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # Hace login en Docker Hub para poder subir la imagen del contenedor al repositorio de Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # Lo busca dentro del entorno de Staging
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6 # equivalente a docker build y docker push, construye la imagen del contenedor y la sube al repositorio de Docker Hub
        with:
          context: ./deployment # Especifica el contexto de construcción
          file: ./deployment/Dockerfile # Especifica el Dockerfile a usar para construir la imagen
          push: true # Indica que la imagen construida debe ser subida al repositorio de Docker Hub
          tags: | # Especifica las etiquetas para la imagen ejemplo: docker.io/<usuario>/<nombre_imagen>:latest
            ${{ vars.DOCKERHUB_REPO }}/${{ vars.IMAGE_NAME }}:latest 

        # Permite autenticarse en Azure usando OIDC (OpenID Connect) para obtener un token de acceso temporal, evitando el uso de credenciales estáticas.
      - name: Login to Azure
        uses: azure/login@v3 
        with: # Usa las credenciales de Azure definidas en los secretos del repositorio para autenticarse
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

        # Ejecuta un comando de Azure CLI para verificar la existencia y configuración de la aplicación de contenedor en Azure Container Apps
      - name: Verify Container App 
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
        run: | # Guarda la salida del comando en formato JSON, mostrando el nombre, grupo de recursos e ID de la aplicación de contenedor especificada.
          az containerapp show \ 
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "{name:name, resourceGroup:resourceGroup, id:id}" \
            --output json

        # Configura y guarda los secretos de la aplicación de contenedor en Azure Container Apps 
      - name: Configure application secrets
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_URL }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
          MODEL_URI: ${{ vars.MODEL_URI }}
        run: |
          set -euo pipefail
          
          # Guarda los secretos de la aplicación de contenedor en Azure Container Apps, 
          # estableciendo las credenciales de Azure y las variables de entorno necesarias para la aplicación.
          az containerapp secret set \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              "azure-tenant-id=$AZURE_TENANT_ID" \
              "azure-client-id=$AZURE_CLIENT_ID" \
              "azure-client-secret=$AZURE_CLIENT_SECRET"

          # Actualiza la aplicación de contenedor para usar los secretos configurados 
          # y crear las variables de entorno necesarias para la aplicación.
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "AZURE_TENANT_ID=secretref:azure-tenant-id" \
              "AZURE_CLIENT_ID=secretref:azure-client-id" \
              "AZURE_CLIENT_SECRET=secretref:azure-client-secret" \
              "MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI" \
              "MODEL_URI=$MODEL_URI"

      - name: Configure private Docker Hub registry
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: | # Le dice a Azure, si necesitas descargar imagenes de Docker Hub, usa estas credenciales para autenticarte y poder descargar la imagen privada del contenedor.
          az containerapp registry set \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --server index.docker.io \
            --username "$DOCKER_USER" \
            --password "$DOCKER_TOKEN"

      - name: Deploy to Azure Container Apps
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: | # Nueva imagen del contenedor que se construyó y subió a Docker Hub, se despliega en la aplicación de contenedor en Azure Container Apps.
          IMAGE="docker.io/${DOCKER_USER}/${IMAGE_NAME}:latest"

          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"
